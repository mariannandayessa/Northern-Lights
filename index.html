<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aurora Nights Gallery</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      background: #090a0f;
      position: relative;
      z-index: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    /* Aurora container and animation */
    .aurora-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
    }

    .aurora {
      width: 100%;
      height: 100%;
      background: linear-gradient(
        120deg,
        rgba(0, 255, 128, 0.3) 0%,
        rgba(0, 255, 255, 0.2) 25%,
        rgba(0, 128, 255, 0.3) 50%,
        rgba(255, 0, 255, 0.15) 75%,
        rgba(0, 255, 128, 0.3) 100%
      );
      animation: auroraFlow 30s ease-in-out infinite alternate;
      filter: blur(80px);
      transform: rotate(15deg);
      opacity: 0.6;
    }

    @keyframes auroraFlow {
      0% { transform: translate(-30%, -30%) rotate(15deg); }
      100% { transform: translate(0%, 0%) rotate(15deg); }
    }

    .aurora2 {
      animation: auroraFlow2 40s ease-in-out infinite alternate;
      opacity: 0.4;
    }

    @keyframes auroraFlow2 {
      0% { transform: translate(20%, -20%) rotate(-10deg); }
      100% { transform: translate(-10%, 10%) rotate(-10deg); }
    }

    #starry-sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: transparent;
    }

    #aurora-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -3;
      filter: brightness(0.6) saturate(1.3);
    }

    nav {
  background: rgba(0, 0, 0, 0.6);
  padding: 1rem 2rem;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100vw; /* Force full viewport width */
  position: relative;
  left: 50%;
  transform: translateX(-50%); /* Center it visually */
  z-index: 1;
	gap: 2rem;
}


nav a {
  color: #82f7ff;
  text-decoration: none;
  font-weight: bold;
  font-size: 1rem;
  transition: color 0.3s ease;
}

nav a:hover {
  color: #00ffe0;
}



    main {
      max-width: 1200px;
      margin: 4rem auto;
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 0 1rem;
    }

    h1 {
      color: #a0f9e0;
      text-shadow: 0 0 10px #82f7ff;
      margin-bottom: 1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 6rem;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(130, 247, 255, 0.5);
    }

    .music-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      padding: 12px;
      cursor: pointer;
      color: #fff;
      font-size: 20px;
      backdrop-filter: blur(5px);
    }


	p{
  color: #a0f9e0;
  text-shadow: 0 0 10px #82f7ff;
	margin-bottom: 2rem;	
}

  </style>
</head>

<!-- Starry Background Script -->
<script>
  const canvas = document.getElementById('starry-sky');
  const ctx = canvas.getContext('2d');

  let stars = [];
  const starCount = 150;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      delta: Math.random() * 0.02
    });
  }

  function animateStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let star of stars) {
      star.alpha += star.delta;
      if (star.alpha <= 0 || star.alpha >= 1) star.delta = -star.delta;
      ctx.globalAlpha = star.alpha;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
    requestAnimationFrame(animateStars);
  }

  animateStars();
</script>

<!-- Music Toggle Button -->
<button class="music-toggle" onclick="toggleMusic()">🔊</button>
<audio id="bg-music" src="aur.mp3" loop></audio>
<script>
  const music = document.getElementById('bg-music');
  let playing = false;
  function toggleMusic() {
    playing ? music.pause() : music.play();
    playing = !playing;
  }
</script>
